name: hirusha-deakin-blue-marble-26

services:
  web:
    image: hirusha-deakin-blue-marble-26-web:latest
    container_name: hirusha-deakin-blue-marble-26-web
    build:
      context: .
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      PROMPT_CHAT_DATA_DIR: /app/.data
    expose:
      - "3000"
    networks:
      - intranet_1
    volumes:
      - type: volume
        source: data
        target: /app/.data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  intranet_1:
    external: true

volumes:
  data:
    name: hirusha-deakin-blue-marble-26-data
